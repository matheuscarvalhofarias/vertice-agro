<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="description" content="TecnologyX Agro — Inteligência de Crédito Rural, Dados e Automação">
  <meta name="color-scheme" content="light dark">
  <script>
    (function() {
      try {
        var s = localStorage.getItem('color-scheme') || 'light dark';
        var meta = document.querySelector('meta[name="color-scheme"]');
        if (meta) meta.content = s;
        var isDark = s === 'dark' || (s === 'light dark' && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
        if (isDark) document.documentElement.classList.add('dark');
      } catch (e) {}
    })();
  </script>
  <title>TecnologyX Agro — Tecnologia, Dados e Automação</title>
  <link rel="icon" type="image/svg+xml" href="assets/tx-logo-mark.svg">
  <link rel="stylesheet" href="assets/mapbox-gl.css">
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="maps.css">
</head>
<body>
  <div id="root"></div>
  <dialog id="modal" aria-labelledby="modal-title"></dialog>
  <div id="toast" role="status" hidden></div>
  <script src="assets/mapbox-gl.js" defer></script>
  <script src="map-config.js" defer></script>
  <script src="maps.js" defer></script>
  <script src="app.js" defer></script>
</body>
</html>
